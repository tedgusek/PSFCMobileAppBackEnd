app = "psfc-backend"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# IMPORTANT: max 1 machine — Puppeteer holds browser state in memory.
# Multiple machines each have their own browser instance and cache,
# so requests would randomly hit different machines with different state.
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  count = 1